apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orders-staging

resources:
  - ../../base
  - namespace.yaml

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
