name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/cards/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README & formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Prettier
        run: npm run format:check
      - name: Card pipeline tests
        run: npm run test:cards
      - name: README structure and images
        run: npm run lint:readme

  go:
    name: Go · orders-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: showcase/services/orders-api/go.mod
          cache: false
      - run: make go-test

  rust:
    name: Rust · edge-ratelimit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.82
        with:
          components: rustfmt, clippy
      - run: make rust-test

  typescript:
    name: TypeScript · resilience-ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make ts-test

  python:
    name: Python · SLO tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make py-test

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    env:
      KUSTOMIZE_VERSION: 5.4.3
      KUBECONFORM_VERSION: 0.6.7
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make k8s-validate

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: make tf-validate

  shell:
    name: Shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7
      - run: make shell-lint

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: showcase/services/orders-api
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
