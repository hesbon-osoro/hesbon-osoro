name: Waka Readme

# Refreshes the "Monthly development breakdown" block from the WakaTime API
# with scripts/waka/index.mjs, authenticated with an OAuth token (WakaTime API
# keys are write-only from 2026-11-01; see scripts/waka/oauth-setup.mjs). Pushes with the README_BOT_SSH_KEY deploy key,
# which is the only actor allowed to bypass the "Protect main" ruleset.

on:
  workflow_dispatch:
  schedule:
    # Twice a day: WakaTime recalculates stats in the background after a
    # request, so the midday run collects what the midnight run triggered.
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: read
  issues: write # renewal reminder for the yearly OAuth token

# Shared with readme-cards.yml so the two never race on pushing to main.
concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.README_BOT_SSH_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Render WakaTime stats
        env:
          WAKATIME_ACCESS_TOKEN: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
          # Fallback only until 2026-11-01, when API keys become write-only.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: node scripts/waka/index.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Updated waka-readme graph with new metrics'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remind 30 days before the WakaTime token expires
        if: ${{ !cancelled() && vars.WAKATIME_TOKEN_EXPIRES != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRES: ${{ vars.WAKATIME_TOKEN_EXPIRES }}
        run: |
          days=$(( ( $(date -ud "$EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "WakaTime OAuth token expires on $EXPIRES ($days days)."
          [ "$days" -gt 30 ] && exit 0
          title='Renew the WakaTime OAuth token'
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            echo "Reminder issue already open."
            exit 0
          fi
          fence='```'
          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          body=$(printf '%s\n' \
            "The token the README bot uses to read WakaTime stats expires on **$EXPIRES** ($days days)." \
            '' \
            'Renew it from a clone of this repository:' \
            '' \
            "${fence}bash" \
            'node scripts/waka/oauth-setup.mjs' \
            "$fence" \
            '' \
            'It stores the new token in the `WAKATIME_ACCESS_TOKEN` secret and updates `WAKATIME_TOKEN_EXPIRES`. Close this issue afterwards.')
          gh issue create --title "$title" --body "$body"
